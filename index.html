<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>tristan adams</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* page styling */
    body {
      margin: 40px;
      font-family: Arial, sans-serif; /* force Arial only */
      font-size: 13px;
      color: blue;       /* all text blue */
      background: orange; /* full page orange background */
      max-width: 700px;
      scroll-behavior: smooth;
      text-transform: lowercase; /* everything lowercase */
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: orange; /* nav matches page background */
      padding: 10px 40px;
      z-index: 1000;
    }

    nav a {
      margin-right: 15px;
      text-decoration: none;
      color: blue; /* nav links blue */
      font-weight: normal;
    }

    nav a:hover {
      opacity: 0.6;
    }

    section {
      padding: 80px 0;
      border-bottom: 1px solid blue; /* subtle blue divider between sections */
    }

    section h2 {
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: normal;
    }

    img {
      max-width: 100%;
      display: block;
      margin-bottom: 20px;
    }

    p {
      margin-bottom: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <nav>
    <a href="#editorial">editorial</a>
    <a href="#journal">journal</a>
    <a href="#publication">publication</a>
    <a href="#video">video</a>
    <a href="#objects">objects</a>
    <a href="#about">about</a>
    <a href="#contact">contact</a>
  </nav>

  <section id="editorial">
    <h2>editorial</h2>
    <img src="editorial1.jpg" alt="editorial project">
    <p>short description of editorial projects.</p>
  </section>

  <section id="journal">
    <h2>journal</h2>
    <img src="journal1.jpg" alt="journal">
    <p>excerpt or description of journal pieces.</p>
  </section>

  <section id="publication">
    <h2>publication</h2>
    <img src="publication1.jpg" alt="publication">
    <p>featured published work or articles.</p>
  </section>

  <section id="video">
    <h2>video</h2>
    <p>embed videos or links here.</p>
